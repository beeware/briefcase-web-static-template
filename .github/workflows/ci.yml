name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@main
    with:
      pre-commit-source: pre-commit

  verify-apps:
    name: Build apps
    needs: pre-commit
    # TESTING: temporarily points at the fork/branch with the -vvv debug fix (#221)
    uses: BabuDip/Beeware.github/.github/workflows/app-build-verify.yml@0b050f49ef120ff86efb580412081571ec069fe5  # add-ci-verbose-logging-221-v2
    with:
      runner-os: ${{ matrix.runner-os }}
      framework: ${{ matrix.framework }}
      target-platform: web
      target-format: static
      workflow-repo: BabuDip/Beeware.github
      workflow-repo-ref: 0b050f49ef120ff86efb580412081571ec069fe5
    strategy:
      matrix:
        runner-os: [ "macos-latest", "windows-latest", "ubuntu-latest" ]
        framework: ["toga"]
